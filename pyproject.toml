[project]
name = "astock-agent"
version = "1.0.0"
description = "A股智能分析Agent工具 - 实时选股、多维分析、回测与策略制定"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "astock-agent", email = "astock@example.com"}
]
dependencies = [
    "akshare>=1.14.0",
    "baostock>=0.8.0",
    "requests>=2.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "ta-lib>=0.4.32",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "jieba>=0.42.1",
]

[project.scripts]
astock = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
